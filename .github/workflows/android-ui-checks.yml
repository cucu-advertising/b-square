name: Bsquare Android UI checks

on:
  push:
    branches:
      - design/opal-blue-neon-ui
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-ui-checks.yml'

permissions:
  contents: read

jobs:
  expo-android:
    name: Expo SDK 57 / TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Expo SDK dependency compatibility
        run: npx expo install --check
      - name: TypeScript static check
        run: npx tsc --noEmit
      - name: Bundle production Android JavaScript assets
        run: npx expo export --platform android --output-dir /tmp/bsquare-android-export
      - name: Bundle browser preview assets
        run: npx expo export --platform web --output-dir /tmp/bsquare-web-export

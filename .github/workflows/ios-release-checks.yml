name: Bsquare iOS release checks

on:
  push:
    branches:
      - feature/verified-admission-and-safety
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-release-checks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Regenerate package lock from pinned package.json dependencies
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact lockfile dependencies
        working-directory: mobile
        run: npm ci
      - name: Verify Expo SDK package compatibility
        working-directory: mobile
        run: CI=1 npx expo install --check
      - name: TypeScript typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Verify existing App Store bundle ID and dark appearance
        working-directory: mobile
        run: |
          node - <<'NODE'
          const expo = require('./app.config.js')();
          if (expo.ios?.bundleIdentifier !== 'com.cucuadvertising.bsquare') {
            throw new Error('Unexpected iOS bundle ID; existing App Store identity must be retained');
          }
          if (expo.userInterfaceStyle !== 'dark') {
            throw new Error('Dark user interface style is not enabled');
          }
          console.log('Verified iOS bundle ID and appearance');
          NODE
      - name: Commit validated release lockfile
        run: |
          if ! git diff --quiet -- mobile/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/package-lock.json
            git commit -m "chore(mobile): sync release lockfile [skip ci]"
            git push origin HEAD:feature/verified-admission-and-safety
          fi

  review-public-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check publicly accessible backend and legal pages
        run: |
          set -eu
          for url in \
            'https://bsquare-backend.onrender.com/api/v1/health' \
            'https://bsquare.club/privacy-policy' \
            'https://bsquare.club/delete-account/'; do
            echo "Checking $url"
            curl --location --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 85 --output /dev/null "$url"
          done
